<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#14070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#E50914" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="web" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40H80 M40 0V80 M0 0L80 80 M80 0L0 80" stroke="#8a8f98" stroke-opacity="0.08" stroke-width="2"/>
      <circle cx="40" cy="40" r="18" fill="none" stroke="#8a8f98" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#web)"/>

  <!-- Spider emblem -->
  <g transform="translate(145 150)" fill="none" stroke="#B11313" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="110" cy="180" rx="55" ry="78" fill="#B11313"/>
    <ellipse cx="110" cy="105" rx="36" ry="46" fill="#B11313"/>
    <path d="M75 125C35 105 18 70 6 45"/>
    <path d="M68 165C25 165 10 165 6 165"/>
    <path d="M68 205C28 215 14 230 6 248"/>
    <path d="M78 238C42 265 24 295 10 325"/>
    <path d="M145 125C185 105 202 70 214 45"/>
    <path d="M152 165C195 165 210 165 214 165"/>
    <path d="M152 205C192 215 206 230 214 248"/>
    <path d="M142 238C178 265 196 295 210 325"/>
  </g>

  <!-- Title -->
  <g transform="translate(360 210)">
    <text x="0" y="0" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="120" fill="#ffffff" letter-spacing="14" transform="skewX(-12)">
      SPIDEY
    </text>
    <text x="2" y="64" font-family="Arial, sans-serif" font-size="30" fill="#c7c9cf" letter-spacing="3">
      Parallel Web Search Crawler
    </text>
    <text x="2" y="110" font-family="Arial, sans-serif" font-size="22" fill="#9aa0aa">
      Swinging Through the Web of Information  Faster, Smarter, Unstoppable.
    </text>
  </g>
</svg>

